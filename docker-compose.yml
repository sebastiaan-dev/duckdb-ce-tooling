services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ce_map
      POSTGRES_USER: ce_map
      POSTGRES_PASSWORD: ce_map
    ports:
      - "5432:5432"
    volumes:
      - ce-map-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ce_map -d ce_map"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  ce-map-postgres:
